<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Todo List App</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f4f6fb;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .auth-card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 36px 32px;
        }
        .auth-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .auth-icon {
            width: 56px;
            height: 56px;
            border-radius: 14px;
            background: linear-gradient(135deg, #4f46e5 0%, #3730a3 100%);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 26px;
            margin-bottom: 12px;
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="auth-header">
        <div class="auth-icon">
            <i class="bi bi-person-plus"></i>
        </div>
        <h4 class="fw-bold mb-1">Create Account</h4>
        <p class="text-muted small mb-0">Join to organize and track your tasks</p>
    </div>

    <!-- Alert Error Message -->
    <div th:if="${errorMessage}" class="alert alert-danger py-2 small rounded-3" role="alert">
        <i class="bi bi-exclamation-circle-fill me-1"></i> <span th:text="${errorMessage}"></span>
    </div>

    <!-- Register Form -->
    <form th:action="@{/register}" method="post">
        <div class="mb-3">
            <label class="form-label small fw-semibold">Username</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person text-muted"></i></span>
                <input type="text" name="username" class="form-control border-start-0" 
                       placeholder="At least 3 characters" required autofocus>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label small fw-semibold">Password</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-lock text-muted"></i></span>
                <input type="password" name="password" class="form-control border-start-0" 
                       placeholder="At least 6 characters" required>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label small fw-semibold">Confirm Password</label>
            <div class="input-group">
                <span class="input-group-text bg-light border-end-0"><i class="bi bi-shield-check text-muted"></i></span>
                <input type="password" name="confirmPassword" class="form-control border-start-0" 
                       placeholder="Re-enter password" required>
            </div>
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 rounded-3 fw-semibold mt-2">
            Register Account
        </button>
    </form>

    <div class="text-center mt-3">
        <span class="small text-muted">Already have an account? </span>
        <a th:href="@{/login}" class="small fw-semibold text-decoration-none">Sign in here</a>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
